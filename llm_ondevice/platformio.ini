; EWatch on-device LLM feasibility spike - STANDALONE sketch.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM).
;
; Mirrors the EWatchOS2.1 toolchain pin (espressif32@6.13.0 => arduino-esp32
; 2.0.17) so the ST7789 driver / GFX 1.4.7 behave identically. This is NOT
; integrated into the watch OS launcher - it is a self-contained proof that a
; tiny LLM boots and generates text on the real silicon.
;
; Build (isolated core, per the ShortsApps primer):
;   export PLATFORMIO_CORE_DIR=/Users/ewills/Documents/EWatch/.pio-core-shortsapps
;   ~/.platformio/penv/bin/pio run
; Do NOT flash from here - compilation is all that is verified.

[platformio]
default_envs = ewatch

[env:ewatch]
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app: 3 MB app slot (no OTA) + ~896 KB fs. The ~1 MB embedded model
; lives inside the 3 MB app image, so no separate model partition is needed.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Reuse the GFX library already vendored for the bookreader port so this builds
; fully offline against the same version the OS uses (GFX ~1.4.7).
lib_extra_dirs =
    /Users/ewills/Documents/EWatch/EWatch_Firmware/ShortsApps/bookreader/.pio/libdeps/ewatch

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
