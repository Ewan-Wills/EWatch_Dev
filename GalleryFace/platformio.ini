; GalleryFace: a stand-alone EWatch v2 watch face. The AuroraOS analog dial
; over a crossfading slideshow of Claire Wills paintings (all
; hard-coded in flash as JPEGs: src/paintings_data.h from
; tools/build_paintings.py) and QR cards. Same target and toolchain pins as
; AuroraOS (see its platformio.ini for why they are pinned).
[env:ewatch]
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; One factory app partition over the whole flash (no OTA, no filesystem):
; every spare byte goes to paintings.
board_build.partitions  = partitions_maxapp.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.f_cpu       = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    bitbank2/JPEGDEC @ ^1.6.0
    https://github.com/fbiego/CST816S.git
    ricmoo/QRCode @ ^0.0.1
