; EWatch v2 hardware test sketches — standalone, serial-only.
; Each env builds ONE file from src/ and flashes over the watch firmware.
; Reflash AuroraOS afterwards to get the watch back.
;
;   pio run -t upload -t monitor   # V2.1 board: I2C + battery + WiFi
; For a V2.0 board (30k/100k divider) change BAT_DIV_RATIO below to 0.769f.
; Plain `pio run -t upload` (and the IDE upload button) uses default_envs only;
; without it every env is flashed in turn and the LAST one wins.

[platformio]
default_envs = hw

[env]
; Same pin as AuroraOS: unversioned espressif32 resolves to the v3 fork here.
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I../AuroraOS/src/drivers
#j 1,SMturtle2024!
[env:hw]
; V2.1: R6 = R7 = 100k -> tap = 0.5 x VBAT
build_src_filter = +<hw_reader.cpp>
build_flags = ${env.build_flags} -DBAT_DIV_RATIO=0.5f

[env:screen]
; ST7789 panel + backlight + touch-paint test (pio run -e screen -t upload -t monitor)
build_src_filter = +<screen_test.cpp>
lib_deps = moononournation/GFX Library for Arduino @ ~1.4.7
