; HeadFace: a stand-alone EWatch v2 watch face. Ewan's head from his CT scan
; turning under the time, peeling skin -> skull -> brain -> ventricles. All
; frames are pre-rendered (Blender Cycles) and hard-coded in flash as JPEGs:
; src/frames_data.h from tools/build_frames.py. Same target and toolchain pins
; as AuroraOS / GalleryFace.
[env:ewatch]
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; One factory app partition over the whole flash (no OTA, no filesystem):
; every spare byte goes to frames.
board_build.partitions  = partitions_maxapp.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.f_cpu       = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    bitbank2/JPEGDEC @ ^1.6.0
    https://github.com/fbiego/CST816S.git
