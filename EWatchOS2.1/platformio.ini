; EWatch v2 firmware — PlatformIO project.
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
;
; This project targets arduino-esp32 v2.x (what `platform = espressif32` ships
; today). LEDC therefore uses the channel-based API (ledcSetup/ledcAttachPin/
; ledcWrite-by-channel). GFX Library is pinned below 1.5.0 because 1.5+
; depends on v3-only headers (esp32-hal-periman.h).

[platformio]
default_envs = ewatch

; Board revision (see src/drivers/hw_rev.h):
;   pio run -e ewatch       -> V2.1 (default)
;   pio run -e ewatch_v20   -> V2.0 boards
[env:ewatch]
; Pinned: an unversioned "espressif32" resolves to the pioarduino fork (55.x,
; arduino-esp32 v3 / IDF5) on this machine, which breaks the v2-era LEDC API
; and GFX 1.4.7. 6.13.0 ships arduino-esp32 2.0.17 — the combo this firmware
; is written against.
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; huge_app (3 MB app, no OTA) — RF Diag pulls in WiFi+bluedroid BLE which
; together exceed the default 1.25 MB app slot.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
; ewlog's persistent ring lives on the huge_app.csv "spiffs" partition,
; mounted as LittleFS at runtime.
board_build.filesystem  = littlefs
; Island compiled out (see EWATCH_ENABLE_ISLAND); its sources are left in place.
; Optional app modules (src/apps/modules/<name>/) are out unless asked for:
;   custom_apps = doom spotify      (in an env)   or   EW_APPS="doom spotify" pio run
; tools/ew_apps.py adds each one's sources, include dir and -DEW_APP_<NAME>=1.
; Modules: doom, pet, racer, spotify, wakesoak   ("all" = every module)
build_src_filter = +<*> -<apps/island/> -<apps/modules/>
extra_scripts = pre:tools/ew_apps.py
; Default app set for every env (EW_APPS adds more on top).
custom_apps = doom hopper screenshare

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
;   ---- board revision: 21 = V2.1, 20 = V2.0 (hw_rev.h derives the rest) ----
    -DEWATCH_HW_REV=21
    -Isrc/drivers
    -Isrc/core
    -Isrc/apps
    -Isrc/apps/system
    -Isrc/apps/assets
    -Isrc/apps/assets/fonts
    -Isrc/apps/games
    -Isrc/apps/island
    -Isecrets            ; local keys: secrets/*.local.h (git-ignored), modules fall back to their *.example.h
;   ---- feature gates ----
;   Flip any of these to 0 to compile the feature out entirely. The linker
;   then drops the underlying libraries (WiFi/WebServer/DNSServer for the
;   WiFi gate; the QRCode lib for the QR gate; the 3D math + model headers
;   for the viewer gate; the media manifest for the media gate), so the
;   firmware shrinks materially.
    -DEWATCH_ENABLE_WIFI=1
    -DEWATCH_ENABLE_VIEWER3D=1
    -DEWATCH_ENABLE_MEDIA=1
    -DEWATCH_ENABLE_QR=1
;   Island is off: its ~67 KB of static scene buffers sit in internal RAM
;   the BLE stack needs (Bluetooth app). src/apps/island is excluded below.
    -DEWATCH_ENABLE_ISLAND=0
;   ---- diagnostics ----
;   EW_LOG_LEVEL: compile-time log floor (0=ERROR..3=DEBUG); runtime floor is
;   NVS "logLvl" / `log level <n>`. EW_DEV_MODE=1 forces simulated (serial-
;   preserving) sleep even without a USB host attached.
    -DEW_LOG_LEVEL=3
;   -DEW_DEV_MODE=1
;   ---- size / dead-code ----
;   Per-function/per-data sections + linker gc shaves anything our build
;   doesn't actually reference (settings views for disabled features, etc.).
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
    ricmoo/QRCode @ ^0.0.1
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/JPEGDEC @ ^1.6.0

; ---------------------------------------------------------------------------
; V2.0 boards: 30k/100k battery divider, default WiFi TX power.
;   pio run -e ewatch_v20 -t upload
; ---------------------------------------------------------------------------
[env:ewatch_v20]
extends = env:ewatch
build_unflags = -DEWATCH_HW_REV=21
build_flags = ${env:ewatch.build_flags} -DEWATCH_HW_REV=20

; ---------------------------------------------------------------------------
; Opt-in: compile local keys (secrets/secrets.local.h, git-ignored) into the
; firmware. Only use when you mean to; every other env builds without keys.
;   cp secrets/secrets.example.h secrets/secrets.local.h   # fill it in
;   pio run -e ewatch_secrets -t upload
; ---------------------------------------------------------------------------
[env:ewatch_secrets]
extends = env:ewatch
build_flags = ${env:ewatch.build_flags} -DEWATCH_WITH_SECRETS=1 -Isecrets
custom_apps = doom hopper screenshare spotify
