; TankFace: a stand-alone EWatch v2 watch face. A rectangular Tank-style dial
; (radial Roman numerals, chemin-de-fer minute track, blued sword hands). The
; dial is baked into flash as RGB565 (src/dial_data.h from
; tools/build_dial.py); the hands are drawn live. Same target and toolchain
; pins as EWatchOS / GalleryFace / HeadFace.
[env:ewatch]
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; Same partition table as EWatchOS2.1, so swapping between the two is a plain upload.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.f_cpu       = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
