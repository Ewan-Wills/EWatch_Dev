; EWatch — BasicDigital firmware. A deliberately minimal watch built on the
; SAME hardware bring-up + runtime architecture as FirstOS, stripped down to
; three screens: a digital watch face, plus Settings pages for setting the
; time and the date on the RV-3028 RTC.
;
; Every hardware / power / sleep / watchdog implementation decision is inherited
; verbatim from FirstOS (see src/main.cpp + src/core + src/drivers). The only
; thing that shrank is the app surface — no WiFi, carousel, fonts, 3D viewer,
; media player, QR, stopwatch or countdown timer.
;
; Target: ESP32-S3FH4R2 (4 MB internal flash, 2 MB internal QSPI PSRAM, native USB).
; This targets arduino-esp32 v2.x (what `platform = espressif32` ships today),
; so LEDC uses the channel-based API. GFX Library is pinned below 1.5.0 because
; 1.5+ depends on v3-only headers (esp32-hal-periman.h).

[env:ewatch]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
; Symbolicate panic backtraces (PC + frames -> file:line) inline in the monitor.
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.flash_mode  = qio
board_build.psram_type  = qspi
; The board profile (esp32-s3-devkitc-1) describes an 8 MB part, so with no
; explicit table PlatformIO auto-selects the *8 MB* default partition layout —
; whose app1 / spiffs / coredump partitions sit beyond the real 4 MB of flash
; on this ESP32-S3FH4R2. The 2nd-stage bootloader rejects that table and resets
; in a tight loop *before* the app ever runs (no serial output, Saved PC inside
; the bootloader). Pin the genuine 4 MB OTA table so every partition fits.
board_build.partitions  = default.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Isrc/drivers
    -Isrc/core
    -Isrc/ui
;   Linker gc shaves anything the build doesn't reference. (arduino-esp32 already
;   enables function/data sections + --gc-sections by default, so this is
;   redundant belt-and-suspenders.)
    -Wl,--gc-sections

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
