; ClaudeFace: a stand-alone EWatch v2 firmware that is only the Claude Code
; face (landscape, fed over USB serial by ClaudeFace/bridge). No launcher, no
; other faces, no WiFi, no sleep. Same target and toolchain pins as AuroraOS /
; HeadFace / GalleryFace: espressif32@6.13.0 (arduino-esp32 2.0.17, gnu++11).
[env:ewatch]
platform        = espressif32@6.13.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
; Same table as AuroraOS (NVS at 0x9000), so the settings migration can read
; AuroraOS' "ewatch" namespace. No filesystem is used.
board_build.partitions  = huge_app.csv
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.f_cpu       = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
; Warnings for our own sources only (libraries keep their own flags).
build_src_flags =
    -Wall
    -Wextra

lib_deps =
    moononournation/GFX Library for Arduino @ ~1.4.7
    https://github.com/fbiego/CST816S.git
